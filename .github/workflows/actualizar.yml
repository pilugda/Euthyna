name: Actualizar datos del Congreso
on:
  schedule:
    - cron: "30 5 * * *"   # cada dia, 05:30 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 actualizar_iniciativas.py
      - name: Guardar cambios
        run: |
          git config user.name "euthyna-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A datos
          git diff --cached --quiet || git commit -m "Datos del Congreso actualizados"
          git push
